<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Safe zone: keep artwork within ~280-744 range (center 512, padding ~27%) -->
  <!-- 2x2 grid of tiles, centered, with empty bottom-right tile -->

  <!-- Tile 1 (top-left) - accent red -->
  <rect x="290" y="290" width="190" height="190" rx="28" fill="#E94560"/>
  <text x="385" y="408" font-size="110" text-anchor="middle"
        fill="white" font-weight="bold" font-family="sans-serif">1</text>

  <!-- Tile 2 (top-right) - dark blue -->
  <rect x="544" y="290" width="190" height="190" rx="28" fill="#0F3460"/>
  <text x="639" y="408" font-size="110" text-anchor="middle"
        fill="white" font-weight="bold" font-family="sans-serif">2</text>

  <!-- Tile 3 (bottom-left) - dark blue -->
  <rect x="290" y="544" width="190" height="190" rx="28" fill="#0F3460"/>
  <text x="385" y="662" font-size="110" text-anchor="middle"
        fill="white" font-weight="bold" font-family="sans-serif">3</text>

  <!-- Empty tile (bottom-right) - subtle outline only -->
  <rect x="544" y="544" width="190" height="190" rx="28"
        fill="none" stroke="#E94560" stroke-width="6" opacity="0.4"/>
</svg>
